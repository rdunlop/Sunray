name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ make git \
            libssl-dev libjpeg-dev libbluetooth-dev

      - name: Configure
        working-directory: linux
        run: make configure

      - name: Build
        working-directory: linux
        run: make build

      - name: Test
        working-directory: linux
        run: make test
